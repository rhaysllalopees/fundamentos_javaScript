<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style.css">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
    button{
        background-color: rgb(37, 132, 170);
        height: 30px;
        border-radius: 8px;
        color: #fff;
        width: 100px;
        height: 40px;
        cursor: pointer;
    }
    body{
        display: flex;
        justify-content: center;
        flex-direction:column;
        max-width: 100%;
        height: 100vh;
        background-color: #113F52;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        border:2px,solid;
        overflow: hidden;

    }
    div{
        display: flex;
        justify-content: center;
        flex-direction:column;
        align-items: center;
        gap: 4px;
        background-color: rgb(103, 163, 173);
        padding: 30px;
        border-radius: 8px;
    }
    #dados-usuario{
        background-color:rgb(0, 0, 0);
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ffff;
        color:#fff
    }

    </style>
</head>
<body>
    <div>
        <div class="div-text">
            <h1 id="title">PAINEL DO USUÁRIO</h1>
            <p id="sub"> PÁGINA INICIAL</p>
        </div>
        <span id="dados-usuario"></span>
        <button onclick="window.location.href='../index.html'" id="button">Sair</button>
    </div>
<script src="../script/user.js"></script>
</body>
</html>
